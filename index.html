<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriReto DIF Irapuato</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  color: white;
  text-align: center;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  margin: 20px 0 10px;
  font-size: clamp(24px, 5vw, 36px);
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

.difficulty-selector {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 30px 0;
}

.difficulty-btn {
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 120px;
}

.difficulty-btn.easy {
  background: #27ae60;
  color: white;
}

.difficulty-btn.easy:hover {
  background: #1e8449;
  transform: scale(1.05);
}

.difficulty-btn.normal {
  background: #f39c12;
  color: white;
}

.difficulty-btn.normal:hover {
  background: #d68910;
  transform: scale(1.05);
}

.difficulty-btn.hard {
  background: #e74c3c;
  color: white;
}

.difficulty-btn.hard:hover {
  background: #c0392b;
  transform: scale(1.05);
}

.header {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 15px;
  margin: 20px 0;
  background: rgba(0,0,0,0.2);
  padding: 15px;
  border-radius: 10px;
}

.stat {
  flex: 1;
  min-width: 80px;
}

.stat span {
  font-size: 24px;
  font-weight: bold;
  display: block;
}

.timer-bar {
  height: 10px;
  background: #27ae60;
  width: 100%;
  transition: width 0.1s linear;
  margin: 15px 0;
  border-radius: 5px;
}

.timer-bar.warning {
  background: #f39c12;
}

.timer-bar.danger {
  background: #e74c3c;
}

#q {
  font-size: clamp(18px, 4vw, 24px);
  margin: 30px 0 20px;
  min-height: 60px;
}

#a {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 20px 0;
}

button.answer {
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  background: #3498db;
  color: white;
  transition: all 0.3s;
  font-weight: bold;
}

button.answer:hover {
  background: #2980b9;
  transform: scale(1.02);
}

button.answer:active {
  transform: scale(0.98);
}

.footer {
  margin-top: 30px;
  font-size: 14px;
  opacity: 0.9;
}

.confetti {
  position: fixed;
  pointer-events: none;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

.difficulty-indicator {
  display: inline-block;
  padding: 5px 15px;
  background: rgba(0,0,0,0.3);
  border-radius: 20px;
  margin-bottom: 15px;
  font-weight: bold;
}

.difficulty-indicator.easy {
  border: 2px solid #27ae60;
}

.difficulty-indicator.normal {
  border: 2px solid #f39c12;
}

.difficulty-indicator.hard {
  border: 2px solid #e74c3c;
}

.back-btn {
  background: rgba(255,255,255,0.2);
  padding: 10px 20px;
  border: 2px solid white;
  border-radius: 5px;
  color: white;
  cursor: pointer;
  font-weight: bold;
  margin-top: 20px;
  transition: all 0.3s;
}

.back-btn:hover {
  background: rgba(255,255,255,0.4);
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }
  
  button.answer {
    padding: 12px;
    font-size: 14px;
  }
  
  .difficulty-btn {
    padding: 12px 20px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🍎 NutriReto DIF Irapuato</h1>
  <p style="margin-bottom: 20px;">Facilitador: Guillermo Alberto Mosiño Esqueda</p>

  <div id="gameContainer" style="display:none;">
    <div class="difficulty-indicator" id="difficultyIndicator"></div>
    <div class="timer-bar" id="bar"></div>

    <div class="header">
      <div class="stat">
        ⏱️ <span id="time">15</span>s
      </div>
      <div class="stat">
        ⭐ <span id="score">0</span>
      </div>
      <div class="stat">
        🎯 <span id="level">1</span>
      </div>
    </div>

    <h2 id="q"></h2>
    <div id="a"></div>
  </div>

  <div id="difficultySelector" style="display:block;">
    <h2 style="margin: 30px 0;">Elige tu nivel de dificultad:</h2>
    <div class="difficulty-selector">
      <button class="difficulty-btn easy" onclick="startGame('easy')">🟢 FÁCIL<br><small>(15s, 10 pts)</small></button>
      <button class="difficulty-btn normal" onclick="startGame('normal')">🟡 NORMAL<br><small>(12s, 15 pts)</small></button>
      <button class="difficulty-btn hard" onclick="startGame('hard')">🔴 DIFÍCIL<br><small>(8s, 20 pts)</small></button>
    </div>
  </div>

  <div class="footer">
    <p>🌱 La nutrición es clave para una vida digna y saludable.</p>
  </div>
</div>

<audio id="ok" preload="auto"></audio>
<audio id="bad" preload="auto"></audio>
<audio id="music" loop preload="auto"></audio>

<script>
const questionsByDifficulty = {
  easy: [
    ["¿Mejor combinación saludable?", ["Verduras+proteína+cereal", "Solo carne", "Solo fruta"], 0],
    ["¿Por qué tomar agua?", ["Funciones del cuerpo", "Solo sed", "No sirve"], 0],
    ["Mucho azúcar causa?", ["Enfermedades", "Salud", "Nada"], 0],
    ["Mejor opción?", ["Fruta natural", "Refresco", "Jugo industrial"], 0],
    ["Energía saludable?", ["Arroz o tortilla", "Refresco", "Dulces"], 0],
    ["Proteínas sirven?", ["Músculos", "Sabor", "Nada"], 0],
    ["Sin verduras?", ["Falta vitaminas", "Nada", "Solo hambre"], 0],
    ["Colación ideal?", ["Fruta/yogurt", "Papas", "Dulces"], 0],
    ["Adulto mayor come poco?", ["Porciones pequeñas", "Obligar", "Quitar comida"], 0],
    ["Poca movilidad?", ["Balance e hidratación", "Reposo", "No comer"], 0],
    ["Falta agua?", ["Deshidratación", "Energía", "Nada"], 0],
    ["Bajo presupuesto?", ["Legumbres", "Comida rápida", "Ultraprocesado"], 0],
    ["Mejor hábito?", ["Comer balanceado", "Una vez al día", "Evitar verduras"], 0],
    ["Mejor bebida?", ["Agua", "Refresco light", "Energética"], 0],
    ["Prevención?", ["Alimentación sana", "Lo que sea", "Saltarse comidas"], 0]
  ],
  normal: [
    ["¿Qué son los carbohidratos complejos?", ["Fibra y almidón", "Solo azúcar", "Grasas"], 0],
    ["Vitamina C previene?", ["Resfriados", "Hambre", "Cansancio"], 0],
    ["Calcio para?", ["Huesos y dientes", "Energía", "Visión"], 0],
    ["Hierro ayuda?", ["Producir sangre", "Digestión", "Dormir"], 0],
    ["Fibra beneficia?", ["Digestión saludable", "Músculo", "Piel"], 0],
    ["Grasas saturadas?", ["Limitar consumo", "Comer mucho", "No importa"], 0],
    ["Omega-3 de?", ["Pescado y nueces", "Pan blanco", "Refrescos"], 0],
    ["Adulto mayor necesita?", ["Proteína extra", "Menos comida", "Solo líquidos"], 0],
    ["Alimentos locales?", ["Frescos y económicos", "Tóxicos", "Pobres nutrientes"], 0],
    ["Porciones correctas?", ["Según edad y actividad", "Todas iguales", "Grandes"], 0],
    ["Antioxidantes?", ["Protegen células", "Engordan", "No sirven"], 0],
    ["Azúcares simples?", ["Rápida energía", "Energía larga", "Sin energía"], 0],
    ["Legumbres aportan?", ["Proteína vegetal", "Solo carbohidratos", "Grasas"], 0],
    ["Horario de comidas?", ["Importante y regular", "Irrelevante", "Una al día"], 0],
    ["Hidratación en ejercicio?", ["Beber agua constante", "No beber", "Tomar refresco"], 0]
  ],
  hard: [
    ["Índice glucémico mide?", ["Absorción de carbohidratos", "Grasa corporal", "Minerales"], 0],
    ["Aminoácidos esenciales?", ["El cuerpo no los produce", "Todos producidos", "No existen"], 0],
    ["Biodisponibilidad es?", ["Cuánto absorbe el cuerpo", "Sabor del alimento", "Precio"], 0],
    ["Síndrome metabólico?", ["Resistencia insulínica", "Alergia alimentaria", "Deficiencia de agua"], 0],
    ["Polifenoles en?", ["Frutas y vegetales", "Carnes procesadas", "Refrescos"], 0],
    ["Leptina regula?", ["Saciedad y apetito", "Digestión", "Sueño"], 0],
    ["Colesterol HDL?", ["Protege el corazón", "Causa enfermedades", "Energía"], 0],
    ["Microbioma intestinal?", ["Bacteria benéfica", "Parásito", "Inflamación"], 0],
    ["Betacaroteno convierte?", ["Vitamina A", "Vitamina C", "Vitamina D"], 0],
    ["Glutatión es?", ["Antioxidante potente", "Vitamina B", "Mineral"], 0],
    ["Resistencia almidón?", ["Carbohidrato resistente", "Tipo de grasa", "Proteína vegetal"], 0],
    ["Cortisol aumenta?", ["Estrés crónico", "Ejercicio light", "Dormir bien"], 0],
    ["Quinua completa?", ["Todos aminoácidos", "Solo carbohidratos", "Sin proteína"], 0],
    ["Fitatos en legumbres?", ["Bloqueadores de minerales", "Probióticos", "Grasas trans"], 0],
    ["Inflamación crónica?", ["Alimentos ultraprocesados", "Frutas frescas", "Agua"], 0]
  ]
};

const difficultySettings = {
  easy: { time: 15, multiplier: 1, label: "🟢 FÁCIL" },
  normal: { time: 12, multiplier: 1.5, label: "🟡 NORMAL" },
  hard: { time: 8, multiplier: 2, label: "🔴 DIFÍCIL" }
};

let currentIndex = 0;
let score = 0;
let time = 15;
let level = 1;
let gameActive = true;
let timerInterval = null;
let currentDifficulty = null;
let currentQuestions = [];

const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const timeEl = document.getElementById("time");
const barEl = document.getElementById("bar");
const questionEl = document.getElementById("q");
const answersEl = document.getElementById("a");
const okAudio = document.getElementById("ok");
const badAudio = document.getElementById("bad");
const musicAudio = document.getElementById("music");
const gameContainer = document.getElementById("gameContainer");
const difficultySelector = document.getElementById("difficultySelector");
const difficultyIndicator = document.getElementById("difficultyIndicator");

okAudio.src = "https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3";
badAudio.src = "https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3";
musicAudio.src = "https://www.bensound.com/bensound-music/bensound-slowmotion.mp3";

function playSound(audio) {
  audio.currentTime = 0;
  audio.play().catch(() => {});
}

function startGame(difficulty) {
  currentDifficulty = difficulty;
  const settings = difficultySettings[difficulty];
  
  // Mezclar preguntas
  currentQuestions = [...questionsByDifficulty[difficulty]].sort(() => Math.random() - 0.5);
  
  currentIndex = 0;
  score = 0;
  level = 1;
  time = settings.time;
  gameActive = true;
  
  difficultySelector.style.display = "none";
  gameContainer.style.display = "block";
  
  difficultyIndicator.textContent = settings.label;
  difficultyIndicator.className = `difficulty-indicator ${difficulty}`;
  
  playSound(musicAudio);
  loadQuestion();
  startTimer();
}

function loadQuestion() {
  if (currentIndex >= currentQuestions.length) {
    endGame();
    return;
  }

  const [question, answers, correctIndex] = currentQuestions[currentIndex];
  
  questionEl.textContent = question;
  answersEl.innerHTML = "";
  
  answers.forEach((answer, idx) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => checkAnswer(idx, correctIndex);
    answersEl.appendChild(button);
  });

  const settings = difficultySettings[currentDifficulty];
  time = settings.time;
  updateDisplay();
}

function checkAnswer(selectedIdx, correctIdx) {
  if (!gameActive) return;
  
  gameActive = false;
  
  const settings = difficultySettings[currentDifficulty];
  
  if (selectedIdx === correctIdx) {
    score += Math.round(10 * settings.multiplier);
    level++;
    playSound(okAudio);
    createConfetti();
  } else {
    playSound(badAudio);
    alert("❌ Respuesta incorrecta\n✅ La correcta era: " + currentQuestions[currentIndex][1][correctIdx]);
  }
  
  currentIndex++;
  gameActive = true;
  loadQuestion();
}

function updateDisplay() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  timeEl.textContent = time;
  
  const percentage = (time / difficultySettings[currentDifficulty].time) * 100;
  barEl.style.width = percentage + "%";
  
  barEl.classList.remove("warning", "danger");
  if (percentage <= 50) barEl.classList.add("warning");
  if (percentage <= 25) barEl.classList.add("danger");
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  
  timerInterval = setInterval(() => {
    if (!gameActive) return;
    
    time--;
    updateDisplay();
    
    if (time <= 0) {
      clearInterval(timerInterval);
      alert("⏰ ¡Tiempo agotado!");
      currentIndex++;
      gameActive = true;
      loadQuestion();
    }
  }, 1000);
}

function createConfetti() {
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "%";
    confetti.style.top = "-10px";
    confetti.style.background = ["#FFD700", "#FF69B4", "#00CED1", "#32CD32", "#FF6347"][Math.floor(Math.random() * 5)];
    confetti.style.width = (Math.random() * 10 + 5) + "px";
    confetti.style.height = confetti.style.width;
    confetti.style.borderRadius = "50%";
    
    document.body.appendChild(confetti);
    
    setTimeout(() => confetti.remove(), 2000);
  }
}

function endGame() {
  clearInterval(timerInterval);
  gameActive = false;
  
  const settings = difficultySettings[currentDifficulty];
  const name = prompt(`🏆 ¡Juego terminado!\n\nNivel: ${settings.label}\nPuntuación: ${score}\n\n¿Cuál es tu nombre?`) || "Anónimo";
  
  let ranking = JSON.parse(localStorage.getItem("nutri-ranking") || "[]");
  ranking.push({ 
    name, 
    score, 
    difficulty: currentDifficulty,
    level: settings.label,
    date: new Date().toLocaleDateString("es-ES")
  });
  ranking.sort((a, b) => b.score - a.score);
  ranking = ranking.slice(0, 20);
  
  localStorage.setItem("nutri-ranking", JSON.stringify(ranking));
  
  showRanking(ranking);
}

function showRanking(ranking) {
  let html = `
    <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin: 20px 0;">
      <h1>🏆 Ranking Top 20</h1>
      <table style="width: 100%; margin: 20px auto; border-collapse: collapse; font-size: 14px;">
        <tr style="background: rgba(255,255,255,0.2);">
          <th style="padding: 10px; border: 1px solid white;">#</th>
          <th style="padding: 10px; border: 1px solid white;">Nombre</th>
          <th style="padding: 10px; border: 1px solid white;">Puntos</th>
          <th style="padding: 10px; border: 1px solid white;">Dificultad</th>
        </tr>
  `;
  
  ranking.forEach((entry, idx) => {
    html += `
      <tr>
        <td style="padding: 10px; border: 1px solid white;">${idx + 1}</td>
        <td style="padding: 10px; border: 1px solid white;">${entry.name}</td>
        <td style="padding: 10px; border: 1px solid white;">⭐ ${entry.score}</td>
        <td style="padding: 10px; border: 1px solid white;">${entry.level}</td>
      </tr>
    `;
  });
  
  html += `
      </table>
    </div>
    <h2 style="margin-top: 30px;">🌱 La nutrición es clave para una vida digna y saludable.</h2>
    <h3>¡Aplica lo aprendido! 💪</h3>
    <button class="back-btn" onclick="location.reload()">🔄 Jugar de Nuevo</button>
  `;
  
  gameContainer.style.display = "none";
  answersEl.innerHTML = "";
  questionEl.innerHTML = html;
  gameContainer.style.display = "block";
}
</script>

</body>
</html>
